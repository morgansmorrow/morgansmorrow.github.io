<!--
  Component: Site header
  Purpose:   Sticky top bar with the wordmark, nav and (desktop) phone number.
             Under 600px the nav sits behind the Menu button (static/js/menu.js).
             Without JS the nav shows as a plain list.
  Classes:   .site-header, .site-header__inner, .wordmark, .wordmark__bolt,
             .site-nav, .site-nav__list, .site-header__call, .menu-toggle, .icon
  Slots:     nav links (href + label), phone number in .site-header__call
  Needs:     <html> gets class "js" from the one-line script in <head>.
-->
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="#top">
      <svg class="wordmark__bolt" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M13.5 2 4 14h7l-1.5 8L20 10h-7l.5-8z"/></svg>
      <span>Dave's Electric</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        <li><a href="#top">Home</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <a class="site-header__call" href="tel:+12074414367">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      207-441-4367
    </a>
  </div>
</header>
